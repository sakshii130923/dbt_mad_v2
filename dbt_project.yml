name: 'dbt_mad'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_mad'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_mad:
    bronze:
      +materialized: view          # lightweight, no storage cost
      bubble:
        +schema: bronze_bubble
      crm:
        +schema: bronze_crm
      platform_commons:
        +schema: bronze_platform_commons
    silver:
      +materialized: table         # persisted for join performance
      bubble:
        +schema: silver_bubble
      crm:
        +schema: silver_crm
      platform_commons:
        +schema: silver_platform_commons
    marts:
      core:
        +materialized: table       # persisted for query performance
        +schema: gold_marts        # dim and fct models belong to gold marts layer
    gold:
      +materialized: table
      analytics:
        +schema: gold_analytics
      external_apps:
        +schema: gold_external_apps
